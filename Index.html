<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Francés con MSc. Lizette Martínez</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --blue: #173b70;
  --red: #d93650;
  --gold: #e5b85c;
  --cream: #fffaf2;
  --text: #26354b;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  scroll-behavior: smooth;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--cream);
  color: var(--text);
}

header {
  background: white;
  padding: 15px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  box-shadow: 0 3px 15px #00000012;
  position: sticky;
  top: 0;
  z-index: 100;
}

.logo {
  font-family: 'Playfair Display', serif;
  color: var(--blue);
  font-size: 22px;
}

.logo span { color: var(--red); }

nav {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: var(--blue);
  font-size: 13px;
  font-weight: 600;
  transition: .3s;
}

nav a:hover { color: var(--red); }

.hero {
  min-height: 620px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 20px;
  color: white;
  background:
    linear-gradient(90deg, #102c50bb, #102c5045),
    url('https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=2000&q=85')
    center 48% / cover;
}

.hero-content {
  max-width: 850px;
  animation: appear 1.5s ease;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(36px, 6vw, 65px);
  margin-bottom: 20px;
}

.hero h1 span { color: #ffda83; }

.hero p {
  font-size: 17px;
  line-height: 1.8;
  margin-bottom: 30px;
}

.btn {
  display: inline-block;
  background: var(--red);
  color: white;
  padding: 14px 28px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: 600;
  transition: .3s;
}

.btn:hover {
  background: var(--gold);
  color: var(--blue);
  transform: translateY(-4px);
}

.experience {
  background: linear-gradient(90deg, var(--blue), #315e99, var(--red));
  color: white;
  padding: 23px 10px;
  text-align: center;
  overflow: hidden;
}

.experience p {
  font-size: 16px;
  font-weight: 600;
  animation: slide 18s linear infinite;
}

@keyframes slide {
  0% { transform: translateX(70%); }
  100% { transform: translateX(-70%); }
}

section {
  padding: 75px 8%;
  scroll-margin-top: 85px;
}

.section-title {
  text-align: center;
  font-family: 'Playfair Display', serif;
  font-size: 36px;
  color: var(--blue);
  margin-bottom: 15px;
}

.subtitle {
  text-align: center;
  color: #777;
  margin-bottom: 45px;
}

.about {
  display: grid;
  grid-template-columns: 1fr 1.4fr;
  gap: 45px;
  align-items: center;
}

.profile {
  background: linear-gradient(145deg, #e7effc, #fff0e8);
  padding: 40px 25px;
  border-radius: 25px;
  text-align: center;
}

.profile .avatar {
  font-size: 95px;
  margin-bottom: 15px;
}

.profile h3 {
  color: var(--blue);
  font-family: 'Playfair Display', serif;
  font-size: 25px;
}

.about-text {
  line-height: 2;
  font-size: 15px;
}

.about-text h3 {
  color: var(--red);
  margin-bottom: 15px;
  font-size: 23px;
}

.credentials {
  margin-top: 20px;
  padding-left: 20px;
}
